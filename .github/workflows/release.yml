name: Комплект контроллера

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости проверки
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Проверить проект
        run: npm test
      - name: Подготовить комплект ESP32
        run: python scripts/prepare_controller_bundle.py
      - name: Сохранить комплект как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-controller
          path: release/handdraw-controller.zip
          if-no-files-found: error
      - name: Создать GitHub Release для тега
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/handdraw-controller.zip
          --title "HandDraw ESP $GITHUB_REF_NAME"
          --generate-notes
