name: Apply commissioning profiles implementation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request_target:
    types: [edited, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-commissioning-profiles
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/commissioning-profiles'
    runs-on: ubuntu-latest
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: agent/commissioning-profiles
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Применить пакет разработки
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .commissioning-overlay/ready ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Пакет уже применён.'
            exit 0
          fi
          test "$(find .commissioning-overlay -maxdepth 1 -name 'part-*' -type f | wc -l)" -eq 5
          cat .commissioning-overlay/part-* > /tmp/commissioning.patch.gz.b64
          base64 --decode /tmp/commissioning.patch.gz.b64 > /tmp/commissioning.patch.gz
          echo '4d365cc0e11d34d26a28e169d7e7595ab39d61fbc7013eee37e182e6ebb63ca8  /tmp/commissioning.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/commissioning.patch.gz > /tmp/commissioning.patch
          git apply --check /tmp/commissioning.patch
          git apply /tmp/commissioning.patch
          rm -rf .commissioning-overlay
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Проверить сборку
        if: steps.apply.outputs.changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm test
          python -m py_compile scripts/*.py tests/*.py

      - name: Зафиксировать реализацию
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add commissioning profiles and pin FluidNC'
          git push origin HEAD:agent/commissioning-profiles
