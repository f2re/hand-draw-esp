name: Import commissioning implementation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: import-commissioning-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  import:
    if: github.event.pull_request.head.ref == 'agent/commissioning-profiles'
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходную ветку
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Восстановить и применить пакет
        shell: bash
        run: |
          set -euo pipefail
          test -f .commissioning-overlay/ready
          test "$(find .commissioning-overlay -maxdepth 1 -name 'part-*' -type f | wc -l)" -eq 5
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import re
          from pathlib import Path

          EXPECTED = "4d365cc0e11d34d26a28e169d7e7595ab39d61fbc7013eee37e182e6ebb63ca8"
          ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          parts = sorted(Path('.commissioning-overlay').glob('part-*'))
          chunks: list[str] = []
          for path in parts:
              source = path.read_text(encoding='utf-8-sig')
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', source)
              print(f'{path.name}: chars={len(clean)} mod4={len(clean) % 4}')
              chunks.append(clean)

          encoded = ''.join(chunks)
          print(f'total: chars={len(encoded)} mod4={len(encoded) % 4}')

          def decode_and_check(value: str) -> bytes | None:
              try:
                  data = base64.b64decode(value + '=' * ((-len(value)) % 4), validate=True)
              except Exception:
                  return None
              return data if hashlib.sha256(data).hexdigest() == EXPECTED else None

          data = decode_and_check(encoded)
          if data is None:
              # part-00 was shortened by exactly one character during the original transfer.
              # Recover that character deterministically against the recorded SHA-256.
              if len(chunks[0]) != 6999 or len(encoded) % 4 != 3:
                  raise SystemExit('Package shape is not the known single-character transfer defect')
              first = chunks[0]
              tail = ''.join(chunks[1:])
              repaired: tuple[int, str, bytes] | None = None

              preferred_positions = [len(first)]
              remaining_positions = range(len(first))
              for position in [*preferred_positions, *remaining_positions]:
                  prefix = first[:position]
                  suffix = first[position:]
                  for symbol in ALPHABET:
                      candidate = prefix + symbol + suffix + tail
                      candidate_data = base64.b64decode(candidate, validate=True)
                      if hashlib.sha256(candidate_data).hexdigest() == EXPECTED:
                          repaired = (position, symbol, candidate_data)
                          break
                  if repaired is not None:
                      break
                  if position and position % 1000 == 0:
                      print(f'repair scan: {position}/{len(first)}')

              if repaired is None:
                  raise SystemExit('Unable to recover the missing Base64 character')
              position, symbol, data = repaired
              print(f'recovered transfer defect: part-00 position={position}, symbol={symbol!r}')

          assert data is not None
          print(f'decoded: bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          Path('/tmp/commissioning.patch.gz').write_bytes(data)
          PY
          gzip -t /tmp/commissioning.patch.gz
          gzip -dc /tmp/commissioning.patch.gz > /tmp/commissioning.patch
          git apply --check /tmp/commissioning.patch
          git apply /tmp/commissioning.patch
          rm -rf .commissioning-overlay
          rm -f .github/workflows/import-commissioning-pr.yml

      - name: Проверить реализацию
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm test
          python -m py_compile scripts/*.py tests/*.py

      - name: Зафиксировать исходники
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add commissioning profiles and pin FluidNC'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
