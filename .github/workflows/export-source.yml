name: Export source for implementation

on:
  push:
    branches:
      - agent/ui-firmware-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack repository source
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf /tmp/source-export.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-source-export
          path: /tmp/source-export.tar.gz
          if-no-files-found: error
          retention-days: 1
