name: Export source for implementation

on:
  push:
    branches:
      - agent/ui-firmware-redesign

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack repository source
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='source-export.tar.gz' -czf source-export.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-source-export
          path: source-export.tar.gz
          if-no-files-found: error
          retention-days: 1
