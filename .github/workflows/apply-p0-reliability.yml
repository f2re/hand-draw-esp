name: Apply P0 reliability implementation

on:
  push:
    branches:
      - agent/p0-reliability
    paths:
      - '.p0-overlay/ready'

permissions:
  contents: write

concurrency:
  group: apply-p0-reliability
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: agent/p0-reliability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Применить проверенный пакет изменений
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .p0-overlay -maxdepth 1 -name 'part-*' -type f | wc -l)" -eq 6
          cat .p0-overlay/part-* > /tmp/handdraw-p0.patch.gz.b64
          base64 --decode /tmp/handdraw-p0.patch.gz.b64 > /tmp/handdraw-p0.patch.gz
          echo '6f2de3dee7fb15cecb71c27148ce6d871bdf69d2c0487ae416e258d7c03df462  /tmp/handdraw-p0.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/handdraw-p0.patch.gz > /tmp/handdraw-p0.patch
          git apply --check /tmp/handdraw-p0.patch
          git apply /tmp/handdraw-p0.patch
          rm -rf .p0-overlay

      - name: Проверить основную сборку
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm test
          python -m py_compile scripts/*.py tests/*.py

      - name: Зафиксировать реализацию
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: harden coordinates, motion and FluidNC transport'
          git push origin HEAD:agent/p0-reliability
