name: Восстановление исходников из текстовых частей

on:
  push:
    branches:
      - agent/cad-rework
    paths:
      - '.source-recovery/READY'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cad-rework
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать обычные исходные файлы
        run: |
          set -euo pipefail
          mkdir -p web/src/fonts hardware
          cat .source-recovery/core/*.part > web/src/core.js
          cat .source-recovery/app/*.part > web/src/app.js
          cat .source-recovery/font/*.part > web/src/fonts/technical-cyrillic.json
          cat .source-recovery/bom/*.part > hardware/bom.csv
          python - <<'PY'
          from __future__ import annotations
          import csv
          import json
          from pathlib import Path

          source = Path('hardware/bom.csv')
          with source.open(encoding='utf-8-sig', newline='') as stream:
              rows = list(csv.DictReader(stream, delimiter=';'))
          Path('hardware/bom.json').write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          rm -rf packed .source-recovery
          rm -f .github/workflows/source-recovery.yml
      - name: Установить зависимости проверки
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Проверить восстановленные исходники
        run: |
          set -euo pipefail
          npm test
          python scripts/prepare_controller_bundle.py
      - name: Зафиксировать восстановление в ветке
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(source): track recoverable WebUI and BOM sources directly'
          git push origin HEAD:agent/cad-rework
