name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repair-recovered-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/cad-rework'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cad-rework
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Удалить перекрытие частей восстановленного core.js
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("web/src/core.js")
          text = path.read_text(encoding="utf-8")
          duplicated = """  const heightJitter = Math.max(0, finiteNumber(options.heightJitter, 0));
            const random = mulberry32((finiteNumber(options.seed, 1) ^ hashText(text)) >>> 0);
            const heightJitter = Math.max(0, finiteNumber(options.heightJitter, 0));
            const random = mulberry32((finiteNumber(options.seed, 1) ^ hashText(text)) >>> 0);
          """
          replacement = """  const heightJitter = Math.max(0, finiteNumber(options.heightJitter, 0));
            const random = mulberry32((finiteNumber(options.seed, 1) ^ hashText(text)) >>> 0);
          """
          count = text.count(duplicated)
          if count == 1:
              path.write_text(text.replace(duplicated, replacement), encoding="utf-8")
          elif count == 0:
              print("Перекрытие уже устранено.")
          else:
              raise SystemExit(f"Неожиданное число совпадений: {count}")
          PY
          node --check web/src/core.js
          node --check web/src/app.js
          python -m json.tool web/src/fonts/technical-cyrillic.json >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/core.js
          if git diff --cached --quiet; then
            echo "Исправление уже применено."
            exit 0
          fi
          git commit -m "fix(web): remove recovered source overlap"
          git push origin HEAD:agent/cad-rework

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости проверки
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Собрать автономный интерфейс
        run: python scripts/build_webui.py
      - name: Проверить вычислительное ядро
        run: node --test tests/core.test.mjs
      - name: Проверить расчёты и структуру CAD
        run: python scripts/validate_cad.py --report build/cad-validation.json
      - name: Проверить структуру проекта
        run: python scripts/validate_repository.py
      - name: Подготовить комплект контроллера
        run: python scripts/prepare_controller_bundle.py
      - name: Сохранить результаты проверки
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-validation
          path: |
            release/handdraw-controller.zip
            build/cad-validation.json
          if-no-files-found: error

  cad-openscad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad
      - name: Скомпилировать сборку и все печатные детали
        run: >-
          python scripts/validate_cad.py
          --strict
          --render-all
          --report build/cad-validation-openscad.json
      - name: Сохранить отчёт OpenSCAD
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-cad-openscad
          path: build/cad-validation-openscad.json
          if-no-files-found: error
