name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  recover-tracked-sources:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/cad-rework'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cad-rework
          fetch-depth: 0
      - name: Восстановить обычные исходники из временных текстовых частей
        run: |
          set -euo pipefail
          if [ ! -f .source-recovery/READY ]; then
            echo "Восстановление уже выполнено."
            exit 0
          fi

          mkdir -p web/src/fonts hardware
          cat .source-recovery/core/*.part > web/src/core.js
          cat .source-recovery/app/*.part > web/src/app.js
          cat .source-recovery/font/*.part > web/src/fonts/technical-cyrillic.json
          cat .source-recovery/bom/*.part > hardware/bom.csv

          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          from pathlib import Path
          from urllib.parse import quote

          source = Path("hardware/bom.csv")
          with source.open(encoding="utf-8-sig", newline="") as stream:
              rows = list(csv.DictReader(stream, delimiter=";"))
          if not rows:
              raise SystemExit("BOM recovery produced no rows")

          extras = [
              ("Направляющая", "MGN12H 300 мм", "1", "Рельс 300 мм; одна каретка MGN12H", "Каретка без клина; размеры внесены в ведомость", 1700, 4000),
              ("Профиль", "Алюминиевый профиль 2020", "1", "350 мм; паз 6; ровный", "T-гайки M5 входят; профиль без заметного изгиба", 500, 1400),
              ("Передача", "Ремень GT2 6 мм", "2 м", "Шаг 2 мм; стекловолоконный или арамидный корд", "Без стального корда; равномерный профиль зуба", 300, 900),
              ("Передача", "Шкив GT2 20T 5 мм", "3", "20 зубьев; отверстие 5 мм; два винта", "Садится на вал без люфта; один винт попадает на D-срез", 250, 750),
              ("Передача", "Зубчатый ролик GT2 M5", "3", "Под ремень 6 мм; ось M5", "Свободное вращение без выраженного люфта", 300, 900),
              ("Опора", "Подшипник 625ZZ", "4", "5×16×5 мм", "Свободное вращение; нет выраженного радиального люфта", 200, 700),
              ("Концевик", "Микропереключатель COM NO NC", "3", "Одинаковая модель; рычаг; три контакта", "Стабильное переключение; известна сетка отверстий", 180, 600),
              ("Основание", "Берёзовая фанера 420×500×12 мм", "1", "Плоская сухая заготовка", "Нет винта и расслоений; диагонали совпадают", 900, 2200),
              ("3D-печать", "PETG 1,75 мм", "1 кг", "Сухая катушка; стабильный диаметр", "Пробные посадки и силовые детали печатаются без расслоения", 1000, 2200),
              ("Хранилище", "microSD 8–32 ГБ", "1", "FAT32; качественная карта", "FluidNC стабильно читает и записывает задания", 400, 1100),
              ("Крепёж", "Термовставки M3", "40", "Латунные; наружный диаметр измерен", "Посадка выбрана по fit_coupon", 300, 900),
              ("Крепёж", "Комплект M3", "1", "M3×8/12/16/25; гайки и шайбы", "Класс не ниже 8.8 для силовых мест; 20% запас", 700, 1800),
              ("Крепёж", "Комплект M4", "1", "M4×12/20; гайки и шайбы", "Длины проверены на пробной сборке", 500, 1300),
              ("Крепёж", "Комплект M5 и T-гайки", "1", "M5×12/16/25; T-гайки паз 6", "T-гайки совместимы с выбранным 2020", 700, 1900),
              ("Проводка", "Провод AWG18", "2 м", "Многожильный медный для 12 В", "Не греется; оконцован НШВИ", 350, 900),
              ("Проводка", "Кабель двигателя 4×AWG22", "5 м", "Гибкий многожильный", "Достаточная длина на полный ход без натяжения", 600, 1600),
              ("Проводка", "Сигнальный провод AWG26", "5 м", "Гибкий; несколько цветов", "Концевики и PWM промаркированы с двух сторон", 350, 1000),
              ("Разъёмы", "JST-XH и наконечники НШВИ", "1 комплект", "Разъёмы под плату и клеммы", "Обжим выполнен кримпером; нет лужёных концов в клеммах", 700, 1800),
              ("Перо", "Пружины сжатия", "1 набор", "Наружный диаметр около 10 мм; несколько жёсткостей", "Подобран нажим 1–3 Н при ходе 3–5 мм", 300, 900),
              ("Перо", "TPU или резиновая прокладка", "1", "Мягкая тонкая вставка для цанги", "Ручка удерживается без повреждения корпуса", 150, 500),
              ("Кабели", "Кабельная цепь или гибкая оплётка", "1", "Под полный ход Y; малый радиус изгиба", "Жгут не попадает под ролики и не тянет балку", 600, 1800),
              ("Бумага", "Низкопрофильные зажимы листа", "4", "Не выступают в траекторию пера", "Лист не смещается при полном задании", 250, 900),
              ("Безопасность", "Аварийная кнопка снятия 12 В", "1", "Фиксируемая; постоянный ток не менее 8 А либо управление реле", "Разрывает питание приводов аппаратно и доступна оператору", 500, 1800),
              ("Охлаждение", "Радиаторы TMC2209", "3", "Под размер микросхемы; теплопроводный скотч", "Не замыкают выводы; температура проверена после 60 минут", 200, 700),
              ("Монтаж", "Стойки и ножки основания", "1 комплект", "Четыре одинаковые ножки и крепёж платы", "Основание не качается; плата изолирована от фанеры", 300, 1000),
          ]

          existing = {row.get("Позиция", "").strip().casefold() for row in rows}
          fieldnames = list(rows[0].keys())
          variants = ["Ozon", "AliExpress", "Wildberries", "Яндекс Маркет"]

          def links(query: str) -> list[str]:
              encoded = quote(query)
              return [
                  f"https://www.ozon.ru/search/?text={encoded}",
                  f"https://aliexpress.ru/wholesale?SearchText={encoded}",
                  f"https://www.wildberries.ru/catalog/0/search.aspx?search={encoded}",
                  f"https://market.yandex.ru/search?text={encoded}",
              ]

          for group, name, quantity, spec, acceptance, price_min, price_max in extras:
              if name.casefold() in existing:
                  continue
              item_links = links(name)
              row = {key: "" for key in fieldnames}
              row.update({
                  "№": str(len(rows) + 1),
                  "Группа": group,
                  "Позиция": name,
                  "Количество": quantity,
                  "Спецификация": spec,
                  "Критерий приёмки": acceptance,
                  "Цена мин, ₽": str(price_min),
                  "Цена макс, ₽": str(price_max),
              })
              for index, (variant, link) in enumerate(zip(variants, item_links), start=1):
                  row[f"Вариант {index}"] = variant
                  row[f"Ссылка {index}"] = link
              rows.append(row)
              existing.add(name.casefold())

          if len(rows) < 25:
              raise SystemExit(f"BOM recovery is incomplete: {len(rows)} rows")

          with source.open("w", encoding="utf-8-sig", newline="") as stream:
              writer = csv.DictWriter(stream, fieldnames=fieldnames, delimiter=";", lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)

          Path("hardware/bom.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Recovered BOM: {len(rows)} rows")
          PY

          python - <<'PY'
          from pathlib import Path
          import json

          required = [
              Path("web/src/core.js"),
              Path("web/src/app.js"),
              Path("web/src/fonts/technical-cyrillic.json"),
              Path("hardware/bom.csv"),
              Path("hardware/bom.json"),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("Recovered sources are missing or empty: " + ", ".join(missing))
          json.loads(Path("web/src/fonts/technical-cyrillic.json").read_text(encoding="utf-8"))
          json.loads(Path("hardware/bom.json").read_text(encoding="utf-8"))
          PY

          rm -rf packed .source-recovery
          rm -f .github/workflows/source-recovery.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нет изменений для фиксации."
            exit 0
          fi
          git commit -m "fix(source): track WebUI and BOM sources directly"
          git push origin HEAD:agent/cad-rework

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости проверки
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Собрать автономный интерфейс
        run: python scripts/build_webui.py
      - name: Проверить вычислительное ядро
        run: node --test tests/core.test.mjs
      - name: Проверить расчёты и структуру CAD
        run: python scripts/validate_cad.py --report build/cad-validation.json
      - name: Проверить структуру проекта
        run: python scripts/validate_repository.py
      - name: Подготовить комплект контроллера
        run: python scripts/prepare_controller_bundle.py
      - name: Сохранить результаты проверки
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-validation
          path: |
            release/handdraw-controller.zip
            build/cad-validation.json
          if-no-files-found: error

  cad-openscad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad
      - name: Скомпилировать сборку и все печатные детали
        run: >-
          python scripts/validate_cad.py
          --strict
          --render-all
          --report build/cad-validation-openscad.json
      - name: Сохранить отчёт OpenSCAD
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-cad-openscad
          path: build/cad-validation-openscad.json
          if-no-files-found: error

  source-archive-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Зафиксировать размер и контрольную сумму повреждённого архива
        run: |
          ls -l packed/hand-draw-esp-complete.tar.gz
          sha256sum packed/hand-draw-esp-complete.tar.gz
      - name: Сохранить архив для восстановления исходников
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-packed-source-diagnostic
          path: packed/hand-draw-esp-complete.tar.gz
          if-no-files-found: error
          compression-level: 0
