name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить проверку YAML
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Собрать автономный интерфейс
        run: python scripts/build_webui.py
      - name: Проверить вычислительное ядро
        run: node --test tests/core.test.mjs
      - name: Проверить структуру проекта
        run: python scripts/validate_repository.py
      - name: Подготовить комплект контроллера
        run: python scripts/prepare_controller_bundle.py
      - name: Сохранить комплект проверки
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-controller-ci
          path: release/handdraw-controller.zip
          if-no-files-found: error
