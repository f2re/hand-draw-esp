name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости проверки
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Собрать автономный интерфейс
        run: python scripts/build_webui.py
      - name: Проверить вычислительное ядро
        run: node --test tests/core.test.mjs
      - name: Проверить расчёты и структуру CAD
        run: python scripts/validate_cad.py --report build/cad-validation.json
      - name: Проверить структуру проекта
        run: python scripts/validate_repository.py
      - name: Подготовить комплект контроллера
        run: python scripts/prepare_controller_bundle.py
      - name: Сохранить результаты проверки
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-validation
          path: |
            release/handdraw-controller.zip
            build/cad-validation.json
          if-no-files-found: error

  ui-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить Playwright и Chromium
        run: |
          python -m pip install --disable-pip-version-check -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Собрать WebUI
        run: python scripts/build_webui.py
      - name: Проверить основной поток и адаптивность
        run: python tests/browser_smoke.py --no-screenshot

  cad-openscad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad
      - name: Скомпилировать сборку и все печатные детали
        run: >-
          python scripts/validate_cad.py
          --strict
          --render-all
          --report build/cad-validation-openscad.json
      - name: Сохранить отчёт OpenSCAD
        uses: actions/upload-artifact@v4
        with:
          name: handdraw-cad-openscad
          path: build/cad-validation-openscad.json
          if-no-files-found: error
