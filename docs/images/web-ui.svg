<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Операционный интерфейс HandDraw ESP</title>
<desc id="description">Три этапа: макет, инструмент и безопасный запуск станка; справа точный предпросмотр листа A4.</desc>
<defs>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
  <style>
    .bg{fill:#ecebe6}.shell{fill:#f7f6f2;stroke:#c7c8c3;stroke-width:2;filter:url(#shadow)}.bar{fill:#f3f2ed}.panel{fill:#fff;stroke:#d8d8d2}.paper{fill:#fffdf8;stroke:#b6b7b1;filter:url(#shadow)}.tab{fill:#e8e7e1}.active{fill:#166d70}.line{fill:none;stroke:#243b3b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.travel{fill:none;stroke:#b58b48;stroke-width:1.2;stroke-dasharray:5 4}.ok{fill:#e3f2ec;stroke:#8bbca8}.warn{fill:#fff5dd;stroke:#dfbf76}.txt{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#344242}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#627070}.head{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f3030}.white{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:white}.num{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#166d70}
  </style>
</defs>
<rect class="bg" width="1200" height="720"/>
<rect class="shell" x="30" y="28" width="1140" height="664" rx="28"/>
<rect class="bar" x="30" y="28" width="1140" height="84" rx="28"/>
<circle cx="76" cy="70" r="22" fill="#166d70"/><text x="69" y="78" font-family="system-ui" font-size="24" font-weight="700" fill="white">H</text>
<text class="head" x="112" y="64">HandDraw</text><text class="small" x="112" y="87">Автономный плоттер · ESP32</text>
<circle cx="974" cy="69" r="5" fill="#8b9693"/><text class="txt" x="990" y="75">Локальная подготовка</text>

<g transform="translate(58 132)">
  <rect class="active" x="0" y="0" width="105" height="40" rx="12"/><text class="white" x="24" y="26">1 · Макет</text>
  <rect class="tab" x="115" y="0" width="135" height="40" rx="12"/><text class="txt" x="135" y="26">2 · Инструмент</text>
  <rect class="tab" x="260" y="0" width="112" height="40" rx="12"/><text class="txt" x="282" y="26">3 · Станок</text>
</g>

<rect class="panel" x="58" y="190" width="455" height="468" rx="20"/>
<text class="small" x="86" y="224">ШАГ 1</text><text class="head" x="86" y="252">Что рисуем</text>
<rect class="tab" x="86" y="274" width="86" height="36" rx="10"/><rect class="active" x="86" y="274" width="86" height="36" rx="10"/><text class="white" x="110" y="297">Текст</text>
<rect class="tab" x="180" y="274" width="72" height="36" rx="10"/><text class="txt" x="204" y="297">SVG</text>
<rect class="tab" x="260" y="274" width="92" height="36" rx="10"/><text class="txt" x="278" y="297">Рисунок</text>
<text class="txt" x="86" y="342">Характер текста</text>
<rect class="tab" x="86" y="356" width="126" height="36" rx="10"/><text class="txt" x="104" y="379">Живой почерк</text>
<rect class="tab" x="220" y="356" width="140" height="36" rx="10"/><text class="txt" x="238" y="379">Аккуратная запись</text>
<rect x="86" y="412" width="397" height="96" rx="12" fill="#f6f6f2" stroke="#d8d8d2"/>
<text class="txt" x="104" y="444">МЕТЕОСТАНЦИЯ № 12</text><text class="txt" x="104" y="470">Температура +18 °C</text>
<text class="small" x="86" y="542">Высота букв</text><rect x="86" y="552" width="128" height="38" rx="10" fill="#f6f6f2" stroke="#d8d8d2"/><text class="txt" x="104" y="577">6,3 мм</text>
<text class="small" x="230" y="542">Выравнивание</text><rect x="230" y="552" width="164" height="38" rx="10" fill="#f6f6f2" stroke="#d8d8d2"/><text class="txt" x="248" y="577">По левому краю</text>
<rect class="active" x="86" y="610" width="182" height="42" rx="12"/><text class="white" x="111" y="637">Обновить макет</text>

<rect class="panel" x="535" y="132" width="605" height="526" rx="20"/>
<text class="small" x="565" y="166">ЛИСТ A4</text><text class="txt" x="565" y="192">Макет в пределах листа</text>
<rect x="914" y="155" width="188" height="34" rx="17" fill="#e3f2ec"/><text class="txt" x="939" y="177">✒ Перо с тушью</text>
<rect class="paper" x="724" y="212" width="278" height="394" rx="4"/>
<rect x="738" y="226" width="250" height="366" fill="none" stroke="#79aeb0" stroke-dasharray="7 5"/>
<path class="travel" d="M758 520 790 300 865 276 815 372 943 386 825 490"/>
<path class="line" d="M770 315v-50l19 50 20-50v50M826 315v-50h38M826 290h31M826 315h38M881 315v-50l42 50v-50"/>
<path class="line" d="M775 414c18-36 45-38 57-4s-17 55-40 34M850 445v-65l42 65v-65M916 445v-65h42"/>
<text class="small" x="565" y="246">Штрихов</text><text class="num" x="565" y="268">47</text>
<text class="small" x="565" y="300">Подъёмов</text><text class="num" x="565" y="322">47</text>
<text class="small" x="565" y="354">Оценка</text><text class="num" x="565" y="376">1:42</text>
<rect class="warn" x="558" y="432" width="142" height="82" rx="12"/><text class="small" x="574" y="458">Перо направленное</text><text class="small" x="574" y="480">обратный ход</text><text class="small" x="574" y="500">не используется</text>
<rect class="ok" x="558" y="530" width="142" height="62" rx="12"/><text class="small" x="574" y="557">Рамка и homing</text><text class="small" x="574" y="579">проверяются до пуска</text>
</svg>
