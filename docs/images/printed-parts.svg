<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Печатные детали HandDraw ESP</title>
  <desc id="desc">Схема основных деталей, печатаемых из PETG</desc>
  <rect width="1200" height="700" fill="#f7fafc"/>
  <text x="60" y="70" font-family="sans-serif" font-size="38" font-weight="700" fill="#17355d">3D-печатные детали HandDraw ESP</text>
  <text x="60" y="108" font-family="sans-serif" font-size="20" fill="#46627f">PETG · сопло 0,4 мм · слой 0,20 мм · 4–6 периметров</text>
  <g font-family="sans-serif" fill="#17355d" stroke="#0b67b2" stroke-width="3">
    <g transform="translate(70 160)"><rect width="250" height="170" rx="18" fill="#eaf2fa"/><circle cx="125" cy="75" r="45" fill="#fff"/><path d="M55 145h140M75 25v100M175 25v100" fill="none"/><text x="22" y="202" stroke="none" font-size="22">Каретка X</text></g>
    <g transform="translate(360 160)"><rect width="210" height="170" rx="18" fill="#eaf7f7"/><rect x="70" y="24" width="70" height="125" rx="25" fill="#fff"/><circle cx="105" cy="54" r="18" fill="#eaf7f7"/><path d="M105 72v62"/><text x="14" y="202" stroke="none" font-size="22">Держатель пера</text></g>
    <g transform="translate(610 160)"><rect width="230" height="170" rx="18" fill="#fff3e6"/><path d="M35 140V45h160v95M70 140V80h90v60" fill="#fff"/><circle cx="115" cy="80" r="30" fill="#fff3e6"/><text x="10" y="202" stroke="none" font-size="22">Кронштейн NEMA17</text></g>
    <g transform="translate(880 160)"><rect width="230" height="170" rx="18" fill="#eaf2fa"/><path d="M35 135h160V70h-45V35H80v35H35z" fill="#fff"/><circle cx="115" cy="88" r="22" fill="#eaf2fa"/><text x="15" y="202" stroke="none" font-size="22">Кронштейн MG90S</text></g>
    <g transform="translate(70 430)"><rect width="250" height="130" rx="18" fill="#eaf7f7"/><path d="M30 80h190M45 50h160M70 30v70M180 30v70" fill="none"/><text x="15" y="164" stroke="none" font-size="22">Пластина кареток Y</text></g>
    <g transform="translate(360 430)"><rect width="210" height="130" rx="18" fill="#fff3e6"/><path d="M45 95h120V45H45zM70 70h70" fill="#fff"/><text x="18" y="164" stroke="none" font-size="22">Зажимы ремня GT2</text></g>
    <g transform="translate(610 430)"><rect width="230" height="130" rx="18" fill="#eaf2fa"/><path d="M50 105V45h130v60M80 45V20h70v25" fill="#fff"/><circle cx="115" cy="75" r="25" fill="#eaf2fa"/><text x="12" y="164" stroke="none" font-size="22">Опора и ролик 625ZZ</text></g>
    <g transform="translate(880 430)"><rect width="230" height="130" rx="18" fill="#eaf7f7"/><path d="M25 100h180V35H25zM45 55h140M45 75h140" fill="#fff"/><text x="18" y="164" stroke="none" font-size="22">Корпус электроники</text></g>
  </g>
  <text x="60" y="650" font-family="sans-serif" font-size="20" fill="#5d6b79">Точные посадки корректируются после измерения приобретённых MGN12H, MG90S, концевиков и крепежа.</text>
</svg>
