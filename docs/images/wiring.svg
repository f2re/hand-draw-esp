<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Схема подключения MKS DLC32</title><desc id="d">Питание, драйверы, двигатели, сервопривод и концевики плоттера.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="currentColor"/></marker><style>.bg{fill:#f6f3ed}.box{fill:#fff;stroke:#bdccd5;stroke-width:2}.title{font:700 27px system-ui,sans-serif;fill:#16395f}.h{font:700 19px system-ui,sans-serif;fill:#16395f}.p{font:15px system-ui,sans-serif;fill:#334b5d}.red{stroke:#d8463a;color:#d8463a}.black{stroke:#26333c;color:#26333c}.blue{stroke:#3278ac;color:#3278ac}.green{stroke:#1c9a72;color:#1c9a72}.purple{stroke:#8a56a8;color:#8a56a8}.wire{fill:none;stroke-width:4;marker-end:url(#a)}.thin{fill:none;stroke-width:2.5;marker-end:url(#a)}.note{fill:#fff3d9;stroke:#e0b75d;stroke-width:2}.pin{font:700 14px ui-monospace,monospace;fill:#234}</style></defs>
<rect class="bg" width="1200" height="720" rx="28"/><text class="title" x="50" y="55">Электрическая схема: 12 В для платы, отдельные 5 В для MG90S</text>
<rect class="box" x="55" y="120" width="190" height="130" rx="16"/><text class="h" x="82" y="158">Адаптер 12 В / 5 А</text><text class="p" x="82" y="190">закрытый корпус</text><text class="p" x="82" y="218">центр разъёма «+»</text>
<rect class="box" x="300" y="100" width="410" height="430" rx="20"/><text class="h" x="333" y="142">MKS DLC32 V2.1 · ESP32</text><rect x="335" y="180" width="150" height="105" rx="12" fill="#1e2b32"/><text x="365" y="238" font-family="system-ui" font-size="18" fill="#fff">ESP32</text>
<rect x="525" y="175" width="145" height="72" rx="10" fill="#e9f1f5"/><text class="h" x="548" y="207">TMC2209 X</text><text class="pin" x="548" y="230">I2SO.1 / .2</text><rect x="525" y="270" width="145" height="72" rx="10" fill="#e9f1f5"/><text class="h" x="548" y="302">TMC2209 Y</text><text class="pin" x="548" y="325">I2SO.5 / .6</text>
<text class="pin" x="335" y="365">X-limit GPIO36</text><text class="pin" x="335" y="395">Y-limit GPIO35</text><text class="pin" x="335" y="425">Servo PWM GPIO32</text><text class="pin" x="335" y="455">SD CS GPIO15</text><text class="p" x="335" y="495">USB / Wi‑Fi / HTTP / WebSocket</text>
<rect class="box" x="780" y="120" width="170" height="100" rx="16"/><text class="h" x="818" y="160">NEMA17 X</text><text class="p" x="812" y="191">4 провода катушек</text><rect class="box" x="780" y="260" width="170" height="100" rx="16"/><text class="h" x="818" y="300">NEMA17 Y</text><text class="p" x="812" y="331">4 провода катушек</text>
<rect class="box" x="50" y="380" width="200" height="130" rx="16"/><text class="h" x="82" y="419">DC/DC 12 → 5 В</text><text class="p" x="82" y="451">не менее 2 А</text><text class="p" x="82" y="480">выставить 5,0 В</text>
<rect class="box" x="50" y="560" width="200" height="100" rx="16"/><text class="h" x="92" y="600">MG90S 180°</text><text class="p" x="92" y="630">+5 В · GND · SIG</text>
<rect class="box" x="790" y="440" width="160" height="75" rx="14"/><text class="h" x="815" y="474">Концевик X</text><text class="p" x="821" y="497">COM + NC</text><rect class="box" x="790" y="555" width="160" height="75" rx="14"/><text class="h" x="815" y="589">Концевик Y</text><text class="p" x="821" y="612">COM + NC</text>
<path class="wire red" d="M245 155H280V170H300"/><text class="p" x="252" y="142">предохранитель 5 А + выключатель</text><path class="wire black" d="M245 218H275V500H300"/>
<path class="wire red" d="M245 175V405H250"/><path class="wire black" d="M245 220V470H250"/>
<path class="wire purple" d="M150 510V555"/><path class="wire black" d="M120 510V555"/><path class="thin blue" d="M300 425H275V610H250"/>
<path class="wire blue" d="M710 210H780"/><path class="wire blue" d="M710 305H780"/><path class="thin green" d="M710 365H760V477H790"/><path class="thin green" d="M710 395H745V592H790"/>
<path class="black" d="M105 540H730" stroke-width="3"/><text class="p" x="315" y="567">общая земля: GND платы, DC/DC, сервопривода и концевиков соединены</text>
<rect class="note" x="980" y="135" width="175" height="260" rx="16"/><text class="h" x="1005" y="172">Критично</text><text class="p" x="1005" y="210">Не подавать 12 В</text><text class="p" x="1005" y="232">на MG90S.</text><text class="p" x="1005" y="270">Драйверы вставлять</text><text class="p" x="1005" y="292">только без питания.</text><text class="p" x="1005" y="330">Проверить пары</text><text class="p" x="1005" y="352">обмоток моторов.</text>
<rect class="note" x="980" y="430" width="175" height="170" rx="16"/><text class="h" x="1005" y="468">Первый пуск</text><text class="p" x="1005" y="505">Без ручки.</text><text class="p" x="1005" y="530">Малые перемещения.</text><text class="p" x="1005" y="555">Питание доступно</text><text class="p" x="1005" y="577">для отключения.</text>
</svg>
