<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">Рабочий процесс HandDraw ESP</title><desc id="d">Пять этапов от подготовки макета до контроля выполнения.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#3b739e"/></marker><style>.bg{fill:#f6f3ed}.card{fill:#fff;stroke:#c5d4dc;stroke-width:2}.n{fill:#16395f}.nt{font:700 18px system-ui,sans-serif;fill:white;text-anchor:middle;dominant-baseline:middle}.h{font:700 19px system-ui,sans-serif;fill:#16395f;text-anchor:middle}.p{font:14px system-ui,sans-serif;fill:#445d6d;text-anchor:middle}.arrow{stroke:#3b739e;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect class="bg" width="1200" height="330" rx="28"/><text x="50" y="48" font-family="system-ui" font-size="27" font-weight="700" fill="#16395f">Порядок работы оператора</text>
<g transform="translate(35 80)"><rect class="card" width="190" height="190" rx="18"/><circle class="n" cx="95" cy="36" r="21"/><text class="nt" x="95" y="36">1</text><text class="h" x="95" y="82">Источник</text><text class="p" x="95" y="116">текст, SVG, фото</text><text class="p" x="95" y="139">или собственный</text><text class="p" x="95" y="162">однолинейный шрифт</text></g>
<g transform="translate(270 80)"><rect class="card" width="190" height="190" rx="18"/><circle class="n" cx="95" cy="36" r="21"/><text class="nt" x="95" y="36">2</text><text class="h" x="95" y="82">Макет</text><text class="p" x="95" y="116">размер, поля, наклон</text><text class="p" x="95" y="139">масштаб, интервалы</text><text class="p" x="95" y="162">порядок штрихов</text></g>
<g transform="translate(505 80)"><rect class="card" width="190" height="190" rx="18"/><circle class="n" cx="95" cy="36" r="21"/><text class="nt" x="95" y="36">3</text><text class="h" x="95" y="82">Предпросмотр</text><text class="p" x="95" y="116">точные траектории</text><text class="p" x="95" y="139">холостые перемещения</text><text class="p" x="95" y="162">границы и время</text></g>
<g transform="translate(740 80)"><rect class="card" width="190" height="190" rx="18"/><circle class="n" cx="95" cy="36" r="21"/><text class="nt" x="95" y="36">4</text><text class="h" x="95" y="82">Передача</text><text class="p" x="95" y="116">G-code → /jobs на SD</text><text class="p" x="95" y="139">проверка имени</text><text class="p" x="95" y="162">$SD/Run=/jobs/…</text></g>
<g transform="translate(975 80)"><rect class="card" width="190" height="190" rx="18"/><circle class="n" cx="95" cy="36" r="21"/><text class="nt" x="95" y="36">5</text><text class="h" x="95" y="82">Контроль</text><text class="p" x="95" y="116">координаты и процент</text><text class="p" x="95" y="139">пауза / продолжить</text><text class="p" x="95" y="162">останов и журнал</text></g>
<path class="arrow" d="M225 175H260"/><path class="arrow" d="M460 175H495"/><path class="arrow" d="M695 175H730"/><path class="arrow" d="M930 175H965"/>
</svg>
